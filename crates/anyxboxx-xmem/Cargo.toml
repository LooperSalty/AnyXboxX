[package]
name = "anyxboxx-xmem"
description = "xmem.dll in Rust: the console memory allocator (ERA heap, XMemAlloc/XMemFree, XMemVirtualQuery, physical pages). Port of runtime/xmem (C++), same exports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "xmem"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The ERA attribute split and XMemIsToolsMemAvailable live in VIctory's xmem module (decision D3).
victory-hle.workspace = true
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
